plugins {
    // New plugin ID for unobfuscated MC 26.1+
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = project.mod_version
group   = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // NO mappings line - MC 26.1.2 ships fully unobfuscated

    // Use plain implementation (no modImplementation) - no remapping needed
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

// In non-remapping Loom, 'jar' is the final artifact (not remapJar)
jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
