name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download latest Gradle
        run: |
          VER=$(curl -s https://services.gradle.org/versions/current | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")
          echo "Gradle $VER"
          wget -q "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -O g.zip
          unzip -q g.zip
          echo "$PWD/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: modpack-core-essentials
          path: build/libs/modpack-core-essentials-*.jar
          if-no-files-found: error
